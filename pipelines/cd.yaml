trigger:
  - develop
pr:
  - none
variables:
  terraformWorkingDir: terraform
  azureServiceConnection: AzureServiceConnection
  terraformVersion: 1.6.6
  buildConfiguration: Release
  AppName: lab11ExtraTaskWeb71977
stages:
  - stage: TerraformPlan
    displayName: Terraform Plan
    jobs:
      - job: Plan
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)
          - task: TerraformTaskV4@4
            inputs:
              provider: azurerm
              command: init
              workingDirectory: $(terraformWorkingDir)
              backendServiceArm: $(azureServiceConnection)
              backendAzureRmResourceGroupName: LabCommon
              backendAzureRmStorageAccountName: common71977
              backendAzureRmContainerName: terraform
              backendAzureRmKey: lab11ExtraTask.tfstate
          - task: TerraformTaskV4@4
            inputs:
              provider: azurerm
              command: plan
              workingDirectory: $(terraformWorkingDir)
              environmentServiceNameAzureRM: $(azureServiceConnection)

  - stage: TerraformApply
    displayName: Terraform Apply
    jobs:
      - job: Apply
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)
          - task: TerraformTaskV4@4
            inputs:
              provider: azurerm
              command: init
              workingDirectory: $(terraformWorkingDir)
              environmentServiceNameAzureRM: $(azureServiceConnection)
              backendServiceArm: $(azureServiceConnection)
              backendAzureRmResourceGroupName: LabCommon
              backendAzureRmStorageAccountName: common71977
              backendAzureRmContainerName: terraform
              backendAzureRmKey: lab11ExtraTask.tfstate
          - task: TerraformTaskV4@4
            inputs:
              provider: azurerm
              command: apply
              workingDirectory: $(terraformWorkingDir)
              environmentServiceNameAzureRM: $(azureServiceConnection)
              commandOptions: -auto-approve

  - stage: BuildApp
    displayName: App - Build & Deploy
    dependsOn: TerraformApply
    jobs:
      - job: BuildApp
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
          - task: UseDotNet@2
            inputs:
              version: '8.0.x'
          - task: DotNetCoreCLI@2
            displayName: Publish APP
            inputs:
              command: publish
              publishWebProjects: false
              # Use the relative path we fixed earlier
              projects: 'GitMvcWebApp/GitMvcWebApp.csproj'
              # Output to ArtifactStagingDirectory and force a zip file
              arguments: '-c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)'
              zipAfterPublish: true 
          - publish: $(Build.ArtifactStagingDirectory)
            artifact: artifact-app
  - stage: DeployApp
    displayName: Deploy App
    dependsOn: BuildApp
    jobs:
      - job: DeployApp
        pool:
          vmImage: windows-latest
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: Download app artifact
            inputs:
              buildType: current
              artifact: artifact-app
              path: $(Pipeline.Workspace)/app
          - task: AzureWebApp@1
            displayName: 'Azure Web App Deploy'
            inputs:
              azureSubscription: $(azureServiceConnection)
              appType: webApp
              # Use the correct variable name we fixed (AppName)
              appName: $(AppName)
              # Point specifically to the zip file created in Step 1
              package: $(Pipeline.Workspace)/app/**/*.zip